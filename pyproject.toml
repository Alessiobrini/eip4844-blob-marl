[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "blob-abm-rl"
version = "0.1.0"
description = "Agent-based model and multi-agent RL for the EIP-4844 blob fee market"
requires-python = ">=3.11"
dependencies = [
    "mesa>=3.0,<4.0",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "omegaconf>=2.3",
    "mlflow>=2.10",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "scipy>=1.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
